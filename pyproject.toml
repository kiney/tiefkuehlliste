[project]
name = "tiefkuehlliste"
version = "0.1.0"
description = "Self-hosted, mobile-first freezer inventory"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["Flask>=3.1,<4", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[project.scripts]
tiefkuehlliste = "tiefkuehlliste.__main__:main"
tiefkuehlliste-password = "tiefkuehlliste.auth:password_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tiefkuehlliste"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
