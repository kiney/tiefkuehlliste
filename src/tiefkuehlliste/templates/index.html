<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tiefkühlliste</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header><div><span class="eyebrow">Aktive Truhe</span><select id="freezer" aria-label="Aktive Tiefkühltruhe"></select></div><nav><button id="theme" class="secondary" aria-label="Farbschema wechseln">◐</button><button id="manage" class="secondary">Truhen</button><button id="history" class="secondary">Verlauf</button><form action="/logout" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="secondary">Abmelden</button></form></nav></header>
<main><section class="quick"><h1>Was kommt hinein?</h1><form id="item-form"><input id="item-id" type="hidden"><label>Produkt<input id="product" required autocomplete="off" list="products" placeholder="z. B. Brokkoli"><datalist id="products"></datalist></label><div id="parts"></div><button type="button" id="add-part" class="secondary">+ Bestandteil</button><details><summary>Datum und Hinweis</summary><div class="grid"><label>Eingefroren<input id="frozen" type="date"></label><label>Haltbar bis<input id="best-before" type="date"></label></div><label>Hinweis<input id="note" maxlength="200"></label></details><div class="actions"><button id="save">Speichern</button><button id="cancel" type="button" class="secondary" hidden>Abbrechen</button></div><p id="form-error" class="error" role="alert"></p></form></section>
<section><div class="list-head"><h2>Bestand</h2><input id="search" type="search" placeholder="Bestand durchsuchen" aria-label="Bestand durchsuchen"></div><p id="status" role="status">Wird geladen …</p><div class="table-wrap"><table class="inventory-table"><thead><tr><th scope="col">Produkt</th><th scope="col">Menge</th><th scope="col">Hinweis</th><th scope="col"><span class="visually-hidden">Aktionen</span></th></tr></thead><tbody id="items"></tbody></table></div></section><button id="show-archive" class="secondary wide">Archiv anzeigen</button><section id="archive" hidden><h2>Archiv</h2><div class="table-wrap"><table class="inventory-table"><thead><tr><th scope="col">Produkt</th><th scope="col">Menge</th><th scope="col">Hinweis</th><th scope="col"><span class="visually-hidden">Aktionen</span></th></tr></thead><tbody id="archived"></tbody></table></div></section></main>
<dialog id="freezer-dialog"><form method="dialog"><button class="close secondary" aria-label="Schließen">×</button><h2>Truhen verwalten</h2><div id="freezer-list"></div><label>Neue Truhe<input id="new-freezer"></label><button type="button" id="create-freezer">Anlegen</button></form></dialog>
<dialog id="history-dialog"><form method="dialog"><button class="close secondary" aria-label="Schließen">×</button><h2>Änderungsverlauf</h2><div id="history-list"></div></form></dialog>
<dialog id="withdraw-dialog"><form id="withdraw-form"><button type="button" class="close secondary" aria-label="Schließen">×</button><h2>Bestand entnehmen</h2><p id="withdraw-product"></p><label>Entnahmequelle<select id="withdraw-source"></select></label><label>Entnahmemenge<input id="withdraw-amount" type="number" min="1" step="1" inputmode="numeric" required></label><p id="withdraw-help" class="hint"></p><p id="withdraw-error" class="error" role="alert"></p><div class="actions"><button type="button" id="withdraw-cancel" class="secondary">Abbrechen</button><button>Entnehmen</button></div></form></dialog>
<script>window.APP_CSRF={{ csrf_token|tojson }};</script><script type="module" src="{{ url_for('static', filename='app.js') }}"></script></body></html>
